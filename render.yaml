# Deploy from your own private Git repository. Review Render's paid service
# and persistent disk charges before creating the Blueprint.
services:
  - type: web
    name: dhampur-green-grow
    runtime: node
    plan: 0.5c-512mb
    region: singapore
    numInstances: 1
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: off
    disk:
      name: grow-storage
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_PATH
        value: /var/data/grow.db
      - key: BACKUP_DIR
        value: /var/data/backups
      - key: BACKUP_RETENTION
        value: "7"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: WORKER_ENABLED
        value: "true"
      - key: OUTREACH_ENABLED
        value: "false"
      - key: DAILY_DISCOVERY_LIMIT
        value: "100"
      - key: DAILY_ENRICHMENT_LIMIT
        value: "50"
      - key: DAILY_EMAIL_LIMIT
        value: "30"
